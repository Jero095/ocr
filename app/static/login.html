<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Statement Reader</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <span class="mark"></span>
      <h1>Statement Reader</h1>
    </div>
    <p class="muted login-intro">Sign in to read and export commission statements.</p>

    <form id="form" autocomplete="on">
      <label class="field">
        <span>Email</span>
        <input id="email" name="email" type="email" required autocomplete="username"
               autofocus spellcheck="false" />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" required
               autocomplete="current-password" />
      </label>
      <div id="error" class="login-error" hidden></div>
      <button id="submit" class="btn primary block" type="submit">Sign in</button>
    </form>

    <p class="muted login-foot">
      Accounts are created by an administrator — there is no self-service signup.
    </p>
  </main>

  <script>
    const form = document.getElementById("form");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");

    form.onsubmit = async (event) => {
      event.preventDefault();
      error.hidden = true;
      submit.disabled = true;
      submit.textContent = "Signing in…";

      // Sent as form data, not JSON: it lets the browser's password manager see a
      // real form submission and offer to save the credentials.
      const body = new FormData();
      body.append("email", document.getElementById("email").value);
      body.append("password", document.getElementById("password").value);

      try {
        const res = await fetch("/api/login", { method: "POST", body });
        if (res.ok) {
          location.href = "/";
          return;
        }
        const data = await res.json().catch(() => ({}));
        error.textContent = data.detail || "Sign in failed.";
        error.hidden = false;
      } catch {
        error.textContent = "Could not reach the server.";
        error.hidden = false;
      }
      submit.disabled = false;
      submit.textContent = "Sign in";
      document.getElementById("password").select();
    };
  </script>
</body>
</html>
